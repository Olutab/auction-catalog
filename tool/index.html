<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Cataloging Workflow | CatalogAI</title>
  <meta name="description" content="Answer three questions to get a ranked shortlist of AI cataloging workflows matched to your auction type, lot volume, and export platform.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    fieldset { border: 1px solid #d8d2c8; border-radius: 6px; margin-bottom: 1.5rem; padding: 1rem 1.25rem; }
    legend { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; padding: 0 0.4rem; }
    .option { display: block; padding: 0.6rem 0.75rem; border-radius: 6px; cursor: pointer; }
    .option:hover { background: var(--bg); }
    .option input { width: 1.25rem; height: 1.25rem; margin-right: 0.6rem; accent-color: var(--accent); vertical-align: middle; }
    #results ol { padding-left: 1.2rem; }
    #results li { margin-bottom: 1.25rem; }
    .why { color: #5a544e; font-size: 0.98rem; }
    .method-note { background: var(--bg); border-left: 4px solid var(--warning); padding: 0.9rem 1rem; font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
       <p style="margin-bottom:1.5rem;"><a href="/" style="font-weight:700; text-decoration:none; color:var(--accent);">← Back to Home</a></p>
    <h1>Find your cataloging workflow</h1>
    <p class="lede">Three questions. A ranked shortlist of the workflows that fit how you actually sell — no account, no upload, nothing leaves your browser.</p>

    <form id="quiz">
      <fieldset>
        <legend>1. What do you mostly sell?</legend>
        <label class="option"><input type="radio" name="goods" value="household"> Mixed household goods (estates, charity, storage)</label>
        <label class="option"><input type="radio" name="goods" value="collectibles"> Collectibles (toys, books, vinyl, decor)</label>
        <label class="option"><input type="radio" name="goods" value="highvalue"> High-value items (coins, jewelry, watches, fine art)</label>
        <label class="option"><input type="radio" name="goods" value="industrial"> Farm, machinery &amp; vehicles</label>
      </fieldset>

      <fieldset>
        <legend>2. How many lots per event?</legend>
        <label class="option"><input type="radio" name="volume" value="small"> Under 100</label>
        <label class="option"><input type="radio" name="volume" value="medium"> 100 to 400</label>
        <label class="option"><input type="radio" name="volume" value="large"> More than 400</label>
      </fieldset>

      <fieldset>
        <legend>3. Where do you export listings?</legend>
        <label class="option"><input type="radio" name="platform" value="HiBid"> HiBid</label>
        <label class="option"><input type="radio" name="platform" value="LiveAuctioneers"> LiveAuctioneers</label>
        <label class="option"><input type="radio" name="platform" value="eBay"> eBay</label>
        <label class="option"><input type="radio" name="platform" value="Facebook Live"> Facebook Live</label>
      </fieldset>
    </form>

    <section id="results" aria-live="polite"></section>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
